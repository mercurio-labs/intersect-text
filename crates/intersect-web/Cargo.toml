"test" = [{ "name" = "all", "path" = "tests/all.rs" }]

["package"]
"autotests" = false
"name" = "intersect-web"
"version" = { "workspace" = true }
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"license" = { "workspace" = true }
"publish" = { "workspace" = true }

["lib"]
"crate-type" = ["cdylib", "rlib"]

["dependencies"]
"intersect-model-test-support" = { "git" = "https://github.com/mercurio-labs/intersect-model.git", "rev" = "de6b99b477fa11b39e889cd83be7a8ebb4f7fa11", "version" = "0.1.0-alpha.1" }
"intersect-model" = { "workspace" = true, "features" = ["xmi", "rhai"] }
"intersect-text" = { "workspace" = true }
"intersect-library" = { "path" = "../intersect-library" }
"serde" = { "workspace" = true }
"serde_json" = { "workspace" = true }

["features"]
"default" = ["wasm-exports"]
"wasm-exports" = []
"milestone-tests" = []

["dev-dependencies"]
"intersect-text-acceptance" = { "path" = "../../tests/text-acceptance" }

["build-dependencies"]
"intersect-model-test-support" = { "git" = "https://github.com/mercurio-labs/intersect-model.git", "rev" = "de6b99b477fa11b39e889cd83be7a8ebb4f7fa11", "version" = "0.1.0-alpha.1" }
"intersect-model" = { "workspace" = true, "features" = ["codegen"] }
