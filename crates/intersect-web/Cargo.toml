"test" = [{ "name" = "all", "path" = "tests/all.rs" }]

["package"]
"autotests" = false
"name" = "intersect-web"
"version" = { "workspace" = true }
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"license" = { "workspace" = true }
"publish" = { "workspace" = true }

["lib"]
"crate-type" = ["cdylib", "rlib"]

["dependencies"]
"intersect-model-test-support" = { "package" = "intersect-model-example-support", "git" = "https://github.com/mercurio-labs/intersect-model.git", "rev" = "ee43b0696a99f966d90bf1b737aaf98e9ac9ba07", "version" = "0.1.0-alpha.1" }
"intersect-model" = { "version" = "=0.1.0-alpha.1", "features" = ["xmi", "rhai"] }
"intersect-text" = "=0.1.0-alpha.1"
"intersect-library" = { "path" = "../intersect-library" }
"serde" = { "workspace" = true }
"serde_json" = { "workspace" = true }

["features"]
"default" = ["wasm-exports"]
"wasm-exports" = []
"milestone-tests" = []

["dev-dependencies"]
"intersect-text-acceptance" = { "package" = "intersect-text-example-support", "path" = "../intersect-text-example-support" }

["build-dependencies"]
"intersect-model-test-support" = { "package" = "intersect-model-example-support", "git" = "https://github.com/mercurio-labs/intersect-model.git", "rev" = "ee43b0696a99f966d90bf1b737aaf98e9ac9ba07", "version" = "0.1.0-alpha.1" }
"intersect-model" = { "version" = "=0.1.0-alpha.1", "features" = ["codegen"] }
