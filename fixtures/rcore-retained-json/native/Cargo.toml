[package]
name="intersect-retained-json-controls"
version="0.0.0"
edition="2024"
publish=false
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[[bin]]
name="retained-json-controls"
path="src/main.rs"
[dependencies]
intersect-model={path="../../../crates/intersect-model",features=["allocation-profile"]}
serde_json="=1.0.151"
[features]
default=["allocation-profile"]
allocation-profile=[]
[profile.dev]
opt-level=1
debug=0
incremental=false
