
["workspace"]
"exclude" = ["tests/text-only"]
"members" = ["crates/intersect-text", "crates/intersect-library", "crates/intersect-web", "tests/text-acceptance", "tests/resource-lifecycle", "tests/model-text"]
"resolver" = "3"
"package" = { "version" = "0.1.0-alpha.1", "edition" = "2024", "rust-version" = "1.88", "license" = "MIT", "repository" = "https://github.com/mercurio-labs/intersect-text", "publish" = false }
"dependencies" = { "intersect-model" = { "version" = "0.1.0-alpha.1", "git" = "https://github.com/mercurio-labs/intersect-model.git", "rev" = "c04011eb4b5c105e466cf33392b5b9237f007551" }, "intersect-text" = { "path" = "crates/intersect-text", "version" = "0.1.0-alpha.1" }, "serde" = { "version" = "1.0.228", "features" = ["derive", "rc"] }, "serde_json" = "1.0.149", "quick-xml" = "0.41.0", "sha2" = "0.10.9", "iri-string" = { "version" = "0.7.12", "default-features" = false, "features" = ["alloc"] } }

["profile"]
"test-fast" = { "inherits" = "dev", "opt-level" = 1, "debug" = 0, "incremental" = true, "package" = { "*" = { "opt-level" = 3 } } }
